<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="calculator" aria-label="Calculator">
        <output class="display" aria-live="polite">0</output>

        <section class="keypad" aria-label="Calculator keys" id="keypad">
            <button class="key key--utility" type="button">AC</button>
            <button class="key key--utility" type="button">±</button>
            <button class="key key--utility" type="button">%</button>
            <button class="key key--operator" type="button" aria-label="Divide">÷</button>

            <button class="key" type="button">7</button>
            <button class="key" type="button">8</button>
            <button class="key" type="button">9</button>
            <button class="key key--operator" type="button" aria-label="Multiply">×</button>

            <button class="key" type="button">4</button>
            <button class="key" type="button">5</button>
            <button class="key" type="button">6</button>
            <button class="key key--operator" type="button" aria-label="Subtract">−</button>

            <button class="key" type="button">1</button>
            <button class="key" type="button">2</button>
            <button class="key" type="button">3</button>
            <button class="key key--operator" type="button" aria-label="Add">+</button>

            <button class="key key--zero" type="button">0</button>
            <button class="key" type="button">.</button>
            <button class="key key--operator" type="button" aria-label="Equals">=</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
